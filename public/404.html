
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>LearnSpace</title>
    <script>
      const segmentCount = 1;
      const locationInfo = window.location;
      const redirectPath = locationInfo.pathname
        .split('/')
        .slice(0, 2)
        .join('/');
      const route = locationInfo.pathname
        .slice(redirectPath.length);
      locationInfo.replace(
        locationInfo.origin + redirectPath +
        '/?redirect=' + encodeURIComponent(route) +
        locationInfo.search.replace(/^\?/, '&') +
        locationInfo.hash
      );
    </script>
  </head>
  <body>Loading LearnSpace...</body>
</html>
